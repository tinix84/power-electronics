name: Validate course website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install math renderer
        run: npm ci
      - name: Build release and validate links
        run: python scripts/build_site.py
      - name: Install browser checks
        run: |
          npm install --no-save playwright@1.62.1
          google-chrome --version
      - name: Check consent and responsive reading pages
        run: node scripts/check_browser.cjs
