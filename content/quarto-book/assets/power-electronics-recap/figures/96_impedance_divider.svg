<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><style>@media(max-width:600px){text{font-size:34px}text.note{display:none}}</style><title id="title">Impedance divider</title><desc id="desc">Vs drives series Z1 and shunt Z2. Output Vo is measured across Z2. Native master: latex/96_impedance_divider.tikz.</desc><g stroke="#26343f" stroke-width="2.5" fill="white"><path fill="none" d="M100 142V70H240M320 70H650M100 198V280H650M470 70V145M470 205V280"/><circle cx="100" cy="170" r="28"/><path d="M92 156H108M100 148V164M92 185H108"/><rect x="240" y="55" width="80" height="30"/><rect x="455" y="145" width="30" height="60"/><circle cx="470" cy="70" r="4" fill="#26343f"/><circle cx="470" cy="280" r="4" fill="#26343f"/><circle cx="650" cy="70" r="5"/><circle cx="650" cy="280" r="5"/></g><g font-family="Georgia,serif" font-size="25" text-anchor="middle" fill="#26343f"><text x="50" y="180">Vₛ</text><text x="280" y="43">Z₁</text><text x="520" y="185">Z₂</text><text x="690" y="80">+</text><text x="690" y="290">−</text><text x="690" y="185">Vₒ</text><text class="note" x="400" y="340" font-family="system-ui,sans-serif" font-size="20">Include source impedance in Z₁. The load is parallel with Z₂.</text></g></svg>
