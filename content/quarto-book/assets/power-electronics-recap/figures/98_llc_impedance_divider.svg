<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><style>@media(max-width:600px){text{font-size:34px}text.note{display:none}}</style><title id="title">LLC fundamental-frequency divider</title><desc id="desc">A sinusoidal source drives series Cr and Lr. Parallel magnetizing inductance Lm and referred AC load Rac form the lower divider arm. Output Vp is measured across the parallel branch. Native master: latex/98_llc_impedance_divider.tikz.</desc><g stroke="#26343f" stroke-width="2.5" fill="white"><path fill="none" d="M85 142V70H230M250 70H315M435 70H800M85 198V280H800M490 70V120M490 230V280M620 70V145M620 205V280"/><circle cx="85" cy="170" r="28"/><path fill="none" d="M65 170C70 145 80 145 85 170S100 195 105 170M230 48V92M250 48V92M315 70c0 -25 30 -25 30 0c0 -25 30 -25 30 0c0 -25 30 -25 30 0c0 -25 30 -25 30 0M490 120c25 0 25 27.5 0 27.5c25 0 25 27.5 0 27.5c25 0 25 27.5 0 27.5c25 0 25 27.5 0 27.5"/><rect x="605" y="145" width="30" height="60"/><g fill="#26343f"><circle cx="490" cy="70" r="4"/><circle cx="490" cy="280" r="4"/><circle cx="620" cy="70" r="4"/><circle cx="620" cy="280" r="4"/></g><circle cx="800" cy="70" r="5"/><circle cx="800" cy="280" r="5"/></g><g font-family="Georgia,serif" font-size="25" text-anchor="middle" fill="#26343f"><text x="140" y="180" text-anchor="start">Vᵢₙ,₁</text><text x="240" y="34">Cᵣ</text><text x="375" y="32">Lᵣ</text><text x="450" y="182">Lₘ</text><text x="665" y="182" text-anchor="start">R<tspan baseline-shift="sub" font-size="65%">ac</tspan></text><text x="850" y="80">+</text><text x="850" y="290">−</text><text x="850" y="182">Vₚ</text><text class="note" x="450" y="343" font-family="system-ui,sans-serif" font-size="20">Fundamental-frequency model. R_ac is the referred AC load.</text></g></svg>
