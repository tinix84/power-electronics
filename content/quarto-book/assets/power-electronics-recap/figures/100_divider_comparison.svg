<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 870" role="img" aria-label="Matched divider ratios with different source resistance"><style>text{font-family:Georgia,'Times New Roman',serif;font-size:26px;fill:#24333f}.wire{fill:none;stroke:#24333f;stroke-width:2.6}.component{fill:white;stroke:#24333f;stroke-width:2.6}.node{fill:#24333f}.note{font-family:Arial,sans-serif;font-size:20px}@media(max-width:600px){text{font-size:32px}.note{display:none}}</style><defs><g id="divider"><path class="wire" d="M90 310V215 M90 155V90H350V125 M350 175V215 M350 215V250 M350 300V310H90 M350 215H550V235 M550 285V310H350 M550 215H650 M550 310H650"/><circle class="component" cx="90" cy="185" r="30"/><path class="wire" d="M78 175H102 M90 163V187 M78 198H102"/><rect class="component" x="336" y="125" width="28" height="50"/><rect class="component" x="336" y="250" width="28" height="50"/><rect class="component" x="536" y="235" width="28" height="50"/><circle class="node" cx="350" cy="215" r="5"/><circle class="node" cx="350" cy="310" r="5"/><circle class="node" cx="550" cy="215" r="5"/><circle class="node" cx="550" cy="310" r="5"/><circle class="component" cx="650" cy="215" r="5"/><circle class="component" cx="650" cy="310" r="5"/><text x="142" y="193">12 V</text><text x="315" y="160" text-anchor="end">R₁</text><text x="315" y="285" text-anchor="end">R₂</text><text x="580" y="270">R<tspan baseline-shift="sub" font-size="70%">L</tspan></text><text x="675" y="222">+</text><text x="675" y="275">V<tspan baseline-shift="sub" font-size="70%">o</tspan></text><text x="675" y="317">−</text></g></defs><text x="35" y="45">A: R₁ = R₂ = 1 kΩ</text><use href="#divider"/><g transform="translate(0 390)"><text x="35" y="45">B: R₁ = R₂ = 100 Ω</text><use href="#divider"/></g><text class="note" x="370" y="770" text-anchor="middle">Use the same load in both circuits.</text><text class="note" x="370" y="803" text-anchor="middle">Disconnect the load for the unloaded case.</text></svg>
