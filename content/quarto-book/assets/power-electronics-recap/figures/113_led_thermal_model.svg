<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 640" role="img" aria-label="One-state LED thermal analogy"><style>text{font:25px Georgia,serif;fill:#24333f}.wire{fill:none;stroke:#24333f;stroke-width:2.6}.part{fill:white;stroke:#24333f;stroke-width:2.6}.dot{fill:#24333f}.note{font:20px Arial,sans-serif}@media(max-width:600px){text{font-size:32px}.note{display:none}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24333f"/></marker></defs><text x="35" y="45">One thermal state, fixed ambient</text><path class="wire" d="M100 450V325 M100 265V140H630V260 M630 290V450H100 M400 140V190 M400 250V315 M400 385V450"/><path class="part" d="M100 265L125 295L100 325L75 295Z"/><path class="wire" d="M100 310V280" marker-end="url(#a)"/><rect class="part" x="386" y="190" width="28" height="60"/><rect class="part" x="386" y="315" width="28" height="70"/><path class="wire" d="M602 260H658 M602 290H658"/><circle class="dot" cx="400" cy="140" r="5"/><circle class="dot" cx="400" cy="450" r="5"/><text x="400" y="110" text-anchor="middle">ΔT<tspan baseline-shift="sub" font-size="70%">j</tspan> = T<tspan baseline-shift="sub" font-size="70%">j</tspan> − T<tspan baseline-shift="sub" font-size="70%">a</tspan></text><text x="145" y="295">P<tspan baseline-shift="sub" font-size="70%">heat</tspan></text><text x="350" y="215" text-anchor="end">R<tspan baseline-shift="sub" font-size="70%">j-sp</tspan> = 5.8 K/W</text><text x="350" y="345" text-anchor="end">R<tspan baseline-shift="sub" font-size="70%">sp-a</tspan></text><text x="350" y="380" text-anchor="end">20 or 140 K/W</text><text x="680" y="265">C<tspan baseline-shift="sub" font-size="70%">θ</tspan></text><text x="680" y="310">0.5 J/K</text><text x="420" y="510" text-anchor="middle">ΔT = 0: fixed ambient reference</text><text class="note" x="420" y="575" text-anchor="middle">Pheat = fh VF I; fh = 0.75 in the baseline.</text><text class="note" x="420" y="611" text-anchor="middle">Only the package resistance is manufacturer-anchored.</text></svg>
