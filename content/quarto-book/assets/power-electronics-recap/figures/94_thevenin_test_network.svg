<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" role="img" aria-labelledby="title desc">
<title id="title">Resistance test with a dependent source</title>
<desc id="desc">The independent voltage source is shorted and the independent current source is opened. The dependent current source g Vx remains connected. A positive 1 V test source drives node a relative to b. Test current It enters the network from the right. Editable master: latex/94_thevenin_test_network.tikz.</desc>
