<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1180" role="img" aria-label="Three ideal LED driver load paths"><style>text{font:26px Georgia,serif;fill:#24333f}.wire{fill:none;stroke:#24333f;stroke-width:2.6}.part{fill:white;stroke:#24333f;stroke-width:2.6}.note{font:20px Arial,sans-serif}@media(max-width:600px){text{font-size:32px}.note{display:none}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24333f"/></marker><g id="loop"><path class="wire" d="M80 295V210 M80 150V100H220 M400 100H570V165 M570 225V295H80"/><circle class="part" cx="80" cy="180" r="30"/><path class="wire" d="M68 168H92 M80 156V180 M68 193H92"/><rect class="part" x="220" y="78" width="180" height="44"/><path class="part" d="M550 165H590L570 215Z"/><path class="wire" d="M548 215H592 M570 215V225"/><path class="wire" d="M600 180L635 150" marker-end="url(#a)"/><path class="wire" d="M610 210L645 180" marker-end="url(#a)"/><text x="130" y="188">5 V</text><text x="600" y="245">LED</text></g></defs><text x="35" y="40">A: voltage regulator</text><use href="#loop"/><text x="310" y="109" text-anchor="middle">CV</text><text x="310" y="175" text-anchor="middle">2.930 V output</text><g transform="translate(0 350)"><text x="35" y="40">B: series resistor</text><use href="#loop"/><text x="310" y="109" text-anchor="middle">R<tspan baseline-shift="sub" font-size="70%">b</tspan></text><text x="310" y="175" text-anchor="middle">5.9143 Ω</text></g><g transform="translate(0 700)"><text x="35" y="40">C: current regulator</text><use href="#loop"/><text x="310" y="109" text-anchor="middle">CC</text><text x="310" y="175" text-anchor="middle">350 mA output</text></g><text class="note" x="380" y="1080" text-anchor="middle">All cases are adjusted at Tj = 25 °C.</text><text class="note" x="380" y="1118" text-anchor="middle">Regulator blocks are ideal load-path models.</text></svg>
