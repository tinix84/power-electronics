<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><style>@media(max-width:600px){text{font-size:34px}text.note{display:none}}</style><title id="title">Wheatstone bridge</title><desc id="desc">Left divider R1/R2 and right divider R3/R4 share excitation. Their midpoints Va and Vb are separate high-impedance sense terminals. R2 is the sensor. Native master: latex/97_wheatstone_bridge.tikz.</desc><g stroke="#26343f" stroke-width="2.5" fill="white"><path fill="none" d="M70 147V40H670V80M70 203V310H670V270M290 40V80M290 130V175M290 175V220M290 270V310M670 130V175M670 175V220M290 175H425M670 175H535"/><circle cx="70" cy="175" r="28"/><path d="M62 161H78M70 153V169M62 190H78"/><rect x="275" y="80" width="30" height="50"/><rect x="275" y="220" width="30" height="50" fill="#e4f1e7"/><rect x="655" y="80" width="30" height="50"/><rect x="655" y="220" width="30" height="50"/><g fill="#26343f"><circle cx="290" cy="40" r="4"/><circle cx="290" cy="175" r="4"/><circle cx="290" cy="310" r="4"/><circle cx="670" cy="175" r="4"/></g><circle cx="425" cy="175" r="5"/><circle cx="535" cy="175" r="5"/></g><g font-family="Georgia,serif" font-size="25" text-anchor="middle" fill="#26343f"><text x="130" y="180" text-anchor="start">Vₑₓ</text><text x="245" y="112">R₁</text><text x="245" y="252">R₂</text><text x="715" y="112">R₃</text><text x="715" y="252">R₄</text><text x="425" y="151">Vₐ</text><text x="535" y="151">V<tspan baseline-shift="sub" font-size="65%">b</tspan></text><text x="480" y="240">Vd = Va − Vb</text><text class="note" x="400" y="355" font-family="system-ui,sans-serif" font-size="20">R₂ senses the measurand. Measure between the two open ports.</text></g></svg>
